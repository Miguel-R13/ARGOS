title: ARGOS - Data Exfiltration via certutil and PowerShell HTTP
id: a3b7c2d5-4e8f-4a9b-c6d2-8f1e3b5a7c9d
status: experimental
description: >
  Detects data exfiltration and lateral tool transfer via Windows LOLBAS.
  Three detection layers:
  1) certutil -encode: converts files to Base64 for exfiltration preparation.
  2) PowerShell Invoke-WebRequest POST: sends data via HTTP to attacker server.
  3) LOLBAS network activity: certutil, bitsadmin, curl, wget with HTTP/FTP URL
     in CommandLine - covers download and upload vectors.
  Layer 1 and 3 use Sysmon Event ID 1 (Process Creation) via sysmon_event1 group.
  Layer 2 uses ScriptBlock Logging Event ID 4104.
  if_group sysmon_event1 identified empirically by analyst in ARGOS lab.
  Wazuh native 92072 only covers certutil -decode (T1140).
  ARGOS adds -encode (T1041) and LOLBAS network coverage (T1105).
  Validated empirically in ARGOS lab on Windows 10 Pro 192.168.234.20.
author: ARGOS SOC - Miguel Reguero
date: 2026/08/15
level: high
tags:
  - attack.exfiltration
  - attack.t1041
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_certutil_encode:
    Image|endswith: '\certutil.exe'
    CommandLine|contains: '-encode'
  selection_lolbas_network:
    Image|endswith:
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\curl.exe'
      - '\wget.exe'
    CommandLine|contains:
      - 'http'
      - 'ftp'
  condition: selection_certutil_encode or selection_lolbas_network
falsepositives:
  - Legitimate use of certutil for certificate management
  - Legitimate file downloads via bitsadmin or curl
  - System administrators using native tools for file transfer
references:
  - https://attack.mitre.org/techniques/T1041/
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
