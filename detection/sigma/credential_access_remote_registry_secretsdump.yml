title: ARGOS - Remote Registry Service Enabled for Credential Dumping
id: c5d9e3f1-8a4b-4c7d-b9e2-3f6a8c1d4e7b
status: experimental
description: >
  Detects enabling of RemoteRegistry service from disabled state.
  impacket-secretsdump enables RemoteRegistry to remotely access
  SAM, SYSTEM and SECURITY registry hives for credential dumping.
  Event ID 7040 (Service Control Manager) records service start type changes.
  param4 RemoteRegistry with param2 disabled/deshabilitado indicates
  the service was enabled from a disabled state - suspicious indicator.
  Note: Wazuh pipeline gap documented - rule 102102 works in logtest
  but not in production due to Service Control Manager decoder chain.
  Validated empirically in ARGOS lab using impacket-secretsdump from
  Kali 192.168.234.40 against Windows 10 Pro 192.168.234.20.
author: ARGOS SOC - Miguel Reguero
date: 2026/08/15
level: high
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7040
    param4: 'RemoteRegistry'
    param2|contains:
      - 'disabled'
      - 'deshabilitado'
  condition: selection
falsepositives:
  - Legitimate system administrators enabling RemoteRegistry for remote management
  - Software deployment tools requiring remote registry access
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://github.com/fortra/impacket
