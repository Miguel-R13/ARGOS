title: ARGOS - Scheduled Task Creation via Security Audit Event 4698
id: a7b3c2d1-9e5f-4a8c-b6d4-5f9e2a1c3b6d
status: experimental
description: >
  Detects scheduled task creation via Windows Security Event ID 4698.
  This is the most comprehensive detection vector: covers ALL execution
  contexts (PowerShell, cmd.exe, WMI, scripts) regardless of how schtasks
  was invoked. Field taskContent contains full XML of the task including
  command, trigger and user context.
  Requires auditpol subcategory "Otros eventos de acceso a objetos" enabled.
  Validated empirically in ARGOS lab - confirmed working in production.
  Wazuh native rule 60228 detects at level 4 without T1053.005 context.
  ARGOS rule 101602 elevates to level 10 with MITRE mapping.
author: ARGOS SOC - Miguel Reguero
date: 2026/08/13
level: high
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
  condition: selection
falsepositives:
  - Legitimate software installation creating scheduled tasks
  - System administrators creating maintenance tasks
  - Windows Update and system tasks
references:
  - https://attack.mitre.org/techniques/T1053/005/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4698
