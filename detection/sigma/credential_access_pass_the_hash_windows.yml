title: ARGOS - Pass the Hash via NTLM Authentication
id: d6e8f2a4-9b3c-4d7e-c1f5-4a7b9d2e5f8c
status: experimental
description: >
  Detects Pass the Hash attack via NTLM authentication with KeyLength 0.
  In legitimate NTLM authentication KeyLength is 128.
  KeyLength 0 indicates the hash was used directly instead of a password.
  Combines with remote NTLM logon (LogonType 3) for high confidence detection.
  Attacker uses NTLM hash obtained from mimikatz (ESC21) to authenticate
  without knowing the plaintext password.
  Tools: impacket-psexec, impacket-wmiexec, CrackMapExec.
  Telemetry: Security Event Log, Event ID 4624, LogonType 3, KeyLength 0.
  ARGOS rule 102200 builds on ESC17 rule 101700 adding KeyLength filter.
  Validated empirically in ARGOS lab using impacket-psexec with NTLM hash
  of Analista (a02213981fd54d8e6e8a6cb0a1aac528) from ESC21.
author: ARGOS SOC - Miguel Reguero
date: 2026/08/15
level: critical
tags:
  - attack.credential_access
  - attack.lateral_movement
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: NTLM
    KeyLength: 0
  filter:
    TargetUserName|endswith: '$'
  condition: selection and not filter
falsepositives:
  - Some legitimate NTLM authentications may show KeyLength 0
  - Network devices authenticating via NTLM
references:
  - https://attack.mitre.org/techniques/T1550/002/
  - https://github.com/fortra/impacket
