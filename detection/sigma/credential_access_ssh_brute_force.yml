title: ARGOS - SSH Brute Force Attempt Detected
id: f8581da5-a6ba-49d6-baf3-b9997e9171e8
status: experimental
description: >
  Detects multiple failed SSH authentication attempts that may indicate
  a brute force attack against the SSH service. Covers both attempts
  with invalid usernames and failed passwords for existing users.
author: ARGOS SOC - Miguel Reguero
date: 2026/07/04
level: high
tags:
  - attack.t1110
logsource:
  product: linux
  service: sshd
detection:
  keywords:
    - 'Failed password for'
    - 'Invalid user'
  condition: keywords
falsepositives:
  - Legitimate users mistyping their password multiple times
  - Automated scripts or password managers with outdated saved credentials
references:
  - https://attack.mitre.org/techniques/T1110/

