title: ARGOS - LSASS Memory Access for Credential Dumping
id: b4c8d3e2-7f5a-4b9c-d8e5-9a2f4a6c8b1d
status: experimental
description: >
  Detects process access to lsass.exe memory for credential dumping.
  Sysmon Event ID 10 (ProcessAccess) with TargetImage lsass.exe is the
  universal invariant keyword covering all credential dumping tools:
  mimikatz, procdump, comsvcs.dll MiniDump, Task Manager dump and any
  other tool that accesses LSASS memory.
  GrantedAccess 0x1410 and 0x1010 are typical for mimikatz sekurlsa.
  Requires Sysmon configuration with lsass.exe in ProcessAccess include rules.
  Validated empirically in ARGOS lab on Windows 10 Pro 192.168.234.20.
author: ARGOS SOC - Miguel Reguero
date: 2026/08/15
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1410'
      - '0x1010'
      - '0x143a'
      - '0x1438'
      - '0x1fffff'
  condition: selection
falsepositives:
  - Legitimate security tools accessing LSASS for monitoring
  - Antivirus engines scanning LSASS memory
  - Windows Defender credential guard operations
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/gentilkiwi/mimikatz
  - https://blog.3or.de/mimikatz-deep-dive-on-lsadumplsa-patch-and-inject.html
