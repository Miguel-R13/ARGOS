title: ARGOS - RDP Brute Force Attack via Failed Logon Events
id: a3f2e1b4-8d5c-4f9a-b7e2-3c6d9f0a2b4e
status: experimental
description: >
  Detects repeated failed logon attempts against Windows endpoints via
  Remote Desktop Protocol. Uses Event ID 4625 (failed logon) as the base
  event. Brute force tools like ncrack and crowbar generate LogonType 3
  (Network/NTLM) rather than LogonType 10 (RemoteInteractive), so no
  LogonType filter is applied to avoid missing real attacks. Validated
  empirically in ARGOS lab using crowbar and ncrack from Kali Linux
  192.168.234.40 against Windows 10 Pro 192.168.234.20.
author: ARGOS SOC - Miguel Reguero
date: 2026/08/12
level: high
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4625
  condition: selection
falsepositives:
  - Legitimate users mistyping their password repeatedly
  - Password rotation scripts with outdated credentials
  - Monitoring tools performing health checks
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
